{{ define "main" }}
<section class="page-list">
  <header class="page-header">
    <h1>{{ i18n "projects_title" }}</h1>
  </header>

  <div class="projects-grid">
    {{ range .Params.projects }}
      {{ partial "project-card.html" (merge . (dict "page" $)) }}
    {{ end }}
  </div>
</section>
{{ end }}
