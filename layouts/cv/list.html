{{ define "main" }}
<section class="page-list">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    <p class="cv-intro">{{ i18n "cv_intro" }}</p>
    {{ with .Content }}<div class="cv-lang-notice">{{ . }}</div>{{ end }}
  </header>

  <div class="cv-grid">
    {{ range .Params.versions }}
      <div class="cv-card fade-in">
        <h3 class="cv-title">{{ .title }}</h3>
        <p class="cv-description">{{ .description }}</p>
        <a href="{{ .file }}" class="cv-download" download>
          {{ i18n "download_cv" }} →
        </a>
      </div>
    {{ end }}
  </div>
</section>
{{ end }}
