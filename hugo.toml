baseURL = "https://renaudrabusseau.com/"
title = "Renaud Rabusseau"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
[pagination]
  pagerSize = 10

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  tag = "tags"

[permalinks]
  blog = "/blog/:slug/"

[languages]
  [languages.en]
    languageName = "EN"
    weight = 1
    title = "Renaud Rabusseau"
    [languages.en.params]
      description = "Electronics | Cybersecurity | Linguistics | Systems Thinking"
  [languages.fr]
    languageName = "FR"
    weight = 2
    title = "Renaud Rabusseau"
    [languages.fr.params]
      description = "Électronique | Cybersécurité | Linguistique | Pensée systémique"
  [languages.es]
    languageName = "ES"
    weight = 3
    title = "Renaud Rabusseau"
    [languages.es.params]
      description = "Electrónica | Ciberseguridad | Lingüística | Pensamiento sistémico"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "About"
    pageRef = "/about/"
    weight = 2
  [[menus.main]]
    name = "Blog"
    pageRef = "/blog/"
    weight = 3
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects/"
    weight = 4
  [[menus.main]]
    name = "CV"
    pageRef = "/cv/"
    weight = 5

[params]
  author = "Renaud Rabusseau"
  accentColor = "#00d4ff"
  accentColorSecondary = "#00a8cc"
